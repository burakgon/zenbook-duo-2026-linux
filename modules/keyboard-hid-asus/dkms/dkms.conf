PACKAGE_NAME="zenbook-duo-hid-asus"
PACKAGE_VERSION="1.0"
# Sources exist for 7.2.x and 7.3.x; other series need a new src/ copy.
BUILD_EXCLUSIVE_KERNEL="^7\.[23]\."
PRE_BUILD="select-source.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build $(grep -q CONFIG_CC_IS_CLANG=y ${kernel_source_dir}/.config && echo LLVM=1) modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="hid-asus"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
