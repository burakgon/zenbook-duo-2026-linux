# zenbook-duo-linux: touchscreen-hid
# The top touchscreen (ACPI TPL0, _HID RAYD0001, _CID PNP0C50) speaks HID-over-I2C.
# raydium_i2c_ts claims it by _HID, misparses the reports and crashes in
# raydium_i2c_irq(). Keep it away so i2c_hid_acpi + hid-multitouch bind instead.
blacklist raydium_i2c_ts
install raydium_i2c_ts /bin/false
