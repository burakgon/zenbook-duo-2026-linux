PACKAGE_NAME="zenbook-duo-soundwire-intel"
PACKAGE_VERSION="7.2.9.1"
# Only 7.2.x needs it: 7.3+ carries the quirk upstream.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build $(grep -q CONFIG_CC_IS_CLANG=y ${kernel_source_dir}/.config && echo LLVM=1) modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="soundwire-intel"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
