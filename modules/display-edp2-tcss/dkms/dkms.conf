PACKAGE_NAME="zenbook-duo-xe"
PACKAGE_VERSION="1.1"
# build.sh fetches this kernel's own xe/i915 sources (a few MB, sparse git clone),
# applies patches/ and builds xe.ko out of tree. If anything fails the stock xe
# stays in use.
BUILD_EXCLUSIVE_KERNEL="^7\."
MAKE[0]="bash ./build.sh ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf src"
BUILT_MODULE_NAME[0]="xe"
BUILT_MODULE_LOCATION[0]="src/drivers/gpu/drm/xe/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
