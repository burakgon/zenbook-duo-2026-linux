# zenbook-duo-linux (power-profile-sync): zenbook-duo-profile-sync writes every
# platform-profile handler itself. PPD's platform_profile driver would emulate
# power-saver by writing "balanced" and then read its own write back as a switch
# to balanced (performance -> power-saver snaps back within a second).
[Service]
ExecStart=
ExecStart=/usr/lib/power-profiles-daemon --block-driver=platform_profile
